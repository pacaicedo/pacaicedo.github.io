<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="firma" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#38D6CF"/><stop offset="0.5" stop-color="#2AA09B"/><stop offset="1" stop-color="#F2B544"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2B544" stop-opacity="0.35"/><stop offset="1" stop-color="#F2B544" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#0B1824"/>
  <rect x="0" y="0" width="1600" height="900" fill="#123047" opacity="0.35"/>
  <g font-family="DejaVu Sans Mono, monospace" fill="#38D6CF" font-size="22" letter-spacing="4">
    <text x="110" y="150">DEL DATO A LA CAUSA · TUTORIAL</text>
  </g>
  <g font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#F7FAFC">
    <text x="106" y="300" font-size="88">DVC <tspan fill="#F2B544">+</tspan> Dropbox</text>
    <text x="110" y="385" font-size="54">Datos fuera de GitHub</text>
  </g>
  <rect x="110" y="420" width="560" height="6" fill="url(#firma)"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#B8CAD6" font-size="30">
    <text x="110" y="490">Versionar, sincronizar y reproducir</text>
    <text x="110" y="532">datos de investigación paso a paso</text>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="26" fill="#38D6CF">
    <text x="110" y="660">$ dvc add data/raw</text>
    <text x="110" y="702" fill="#2AA09B">$ dvc push   → ~/Dropbox/beos-dvc</text>
    <text x="110" y="744" fill="#F2B544">$ dvc pull   ← otra máquina</text>
  </g>
  <g font-family="DejaVu Sans, sans-serif" fill="#B8CAD6" font-size="22">
    <text x="110" y="830">P. E. Caicedo-Rodríguez</text>
  </g>
  <!-- Git: historia de commits -->
  <g stroke="#315064" stroke-width="4" fill="none">
    <line x1="900" y1="250" x2="1440" y2="250"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#B8CAD6">
    <text x="900" y="205">git</text>
  </g>
  <g fill="#0B1824" stroke="#38D6CF" stroke-width="4">
    <circle cx="960" cy="250" r="16"/><circle cx="1140" cy="250" r="16"/><circle cx="1320" cy="250" r="16"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#38D6CF" text-anchor="middle">
    <text x="960" y="300">raw.dvc</text><text x="1140" y="300">dvc.lock</text><text x="1320" y="300">datos-v2</text>
  </g>
  <!-- enlaces por hash -->
  <g stroke="#2AA09B" stroke-width="2.5" stroke-dasharray="8 8" fill="none" opacity="0.9">
    <path d="M960 318 C 960 470, 1180 470, 1180 560"/>
    <path d="M1140 318 C 1140 470, 1180 470, 1180 560"/>
    <path d="M1320 318 C 1320 470, 1180 470, 1180 560"/>
  </g>
  <!-- remote: cilindro -->
  <circle cx="1180" cy="680" r="190" fill="url(#halo)"/>
  <g stroke="#F2B544" stroke-width="4" fill="#123047">
    <path d="M1060 580 v170 a120 34 0 0 0 240 0 v-170"/>
    <ellipse cx="1180" cy="580" rx="120" ry="34"/>
  </g>
  <g stroke="#F2B544" stroke-width="2" fill="none" opacity="0.6">
    <path d="M1060 640 a120 34 0 0 0 240 0"/><path d="M1060 695 a120 34 0 0 0 240 0"/>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#F2B544" text-anchor="middle">
    <text x="1180" y="835">~/Dropbox/beos-dvc</text>
  </g>
  <path d="M1180 555 l9 -21 l21 -9 l-21 -9 l-9 -21 l-9 21 l-21 9 l21 9 z" fill="#F2B544"/>
</svg>
