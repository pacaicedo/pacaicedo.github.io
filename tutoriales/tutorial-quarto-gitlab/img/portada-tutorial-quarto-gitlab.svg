<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14233a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#75aadb"/>
      <stop offset="1" stop-color="#ff7b72"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff7b72"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1250" cy="150" r="320" fill="#ff7b72" fill-opacity="0.05"/>
  <circle cx="1450" cy="820" r="270" fill="#75aadb" fill-opacity="0.07"/>

  <!-- Título -->
  <text x="90" y="170" fill="#ff7b72" font-size="26" font-weight="bold" letter-spacing="7">TUTORIAL · SITIOS WEB</text>
  <text x="84" y="282" fill="#ffffff" font-size="112" font-weight="bold" letter-spacing="1">Quarto</text>
  <text x="90" y="372" fill="#ffffff" font-size="64" font-weight="bold"><tspan fill="#75aadb">+</tspan> GitLab Pages</text>
  <rect x="94" y="398" width="190" height="8" rx="4" fill="url(#accent)"/>
  <text x="90" y="470" fill="#e6edf3" font-size="40">Del repositorio a la web</text>
  <text x="90" y="520" fill="#e6edf3" font-size="40">con un pipeline que publica</text>

  <!-- Pasos -->
  <g font-size="23">
    <rect x="90" y="572" width="560" height="54" rx="8" fill="#1f6feb"/>
    <text x="112" y="607" fill="#fff" font-weight="bold">SSH</text>
    <text x="628" y="607" fill="#dbeafe" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="21">git@gitlab-personal:…</text>

    <rect x="90" y="636" width="560" height="54" rx="8" fill="#8250df"/>
    <text x="112" y="671" fill="#fff" font-weight="bold">Render</text>
    <text x="628" y="671" fill="#ede9fe" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="21">quarto render → _site/</text>

    <rect x="90" y="700" width="560" height="54" rx="8" fill="#c2410c"/>
    <text x="112" y="735" fill="#fff" font-weight="bold">Publicar</text>
    <text x="628" y="735" fill="#ffedd5" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="21">pages: publish: _site</text>
  </g>

  <!-- Ventana del editor con .gitlab-ci.yml -->
  <g filter="url(#shadow)">
    <rect x="790" y="120" width="720" height="440" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <path d="M790 134a14 14 0 0 1 14-14h692a14 14 0 0 1 14 14v40H790z" fill="#161b22"/>
    <circle cx="820" cy="147" r="7" fill="#ff5f57"/>
    <circle cx="845" cy="147" r="7" fill="#febc2e"/>
    <circle cx="870" cy="147" r="7" fill="#28c840"/>
    <text x="1150" y="154" text-anchor="middle" fill="#c9d1d9" font-size="19" font-weight="bold">.gitlab-ci.yml</text>
  </g>
  <g font-family="DejaVu Sans Mono, monospace" font-size="20" xml:space="preserve" style="white-space:pre">
    <g fill="#484f58" text-anchor="end">
      <text x="842" y="218">1</text><text x="842" y="250">2</text><text x="842" y="282">3</text>
      <text x="842" y="314">4</text><text x="842" y="346">5</text><text x="842" y="378">6</text>
      <text x="842" y="410">7</text><text x="842" y="442">8</text><text x="842" y="474">9</text>
      <text x="842" y="506">10</text>
    </g>
    <text x="862" y="218" fill="#8b949e"># Publica el sitio en GitLab Pages</text>
    <text x="862" y="250"><tspan fill="#ffa198">publicar-sitio</tspan><tspan fill="#c9d1d9">:</tspan></text>
    <text x="862" y="282"><tspan fill="#79c0ff">&#160;&#160;image</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">ghcr.io/quarto-dev/quarto:1.8.27</tspan></text>
    <text x="862" y="314"><tspan fill="#79c0ff">&#160;&#160;script</tspan><tspan fill="#c9d1d9">:</tspan></text>
    <text x="862" y="346"><tspan fill="#c9d1d9">&#160;&#160;&#160;&#160;- </tspan><tspan fill="#a5d6ff">quarto render</tspan></text>
    <text x="862" y="378"><tspan fill="#79c0ff">&#160;&#160;pages</tspan><tspan fill="#c9d1d9">:</tspan></text>
    <text x="862" y="410"><tspan fill="#79c0ff">&#160;&#160;&#160;&#160;publish</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">_site</tspan></text>
    <text x="862" y="442"><tspan fill="#79c0ff">&#160;&#160;rules</tspan><tspan fill="#c9d1d9">:</tspan></text>
    <text x="862" y="474"><tspan fill="#c9d1d9">&#160;&#160;&#160;&#160;- </tspan><tspan fill="#79c0ff">if</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#d2a8ff">$CI_COMMIT_BRANCH</tspan></text>
    <text x="862" y="506"><tspan fill="#c9d1d9">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;== </tspan><tspan fill="#d2a8ff">$CI_DEFAULT_BRANCH</tspan><tspan fill="#ff7b72">▌</tspan></text>
  </g>

  <!-- push -> pipeline -> sitio -->
  <g font-family="DejaVu Sans Mono, monospace" font-size="20">
    <rect x="790" y="660" width="190" height="52" rx="26" fill="#0d1117" stroke="#75aadb" stroke-width="2"/>
    <text x="885" y="693" text-anchor="middle" fill="#a5d6ff">git push</text>
    <path d="M988 686H1040" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <rect x="1050" y="660" width="200" height="52" rx="26" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <circle cx="1080" cy="686" r="9" fill="#3fb950"/>
    <path d="M1075 686l4 4 7-8" fill="none" stroke="#0d1117" stroke-width="2.5"/>
    <text x="1162" y="693" text-anchor="middle" fill="#7ee787">pipeline</text>
    <path d="M1258 686H1310" stroke="#ff7b72" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <rect x="1320" y="660" width="190" height="52" rx="26" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
    <text x="1415" y="693" text-anchor="middle" fill="#ffa198">.gitlab.io</text>
  </g>
  <text x="1150" y="768" text-anchor="middle" fill="#8b949e" font-size="22">cada push a main renderiza y publica el sitio</text>
</svg>
