stages:
  preprocesamiento:
    cmd: python src/preprocesar.py
    deps:
      - src/preprocesar.py
      - data/raw
    params:
      - preprocesamiento
    outs:
      - data/curated
  analisis:
    cmd: python src/caracteristicas.py
    deps:
      - src/caracteristicas.py
      - data/curated
    outs:
      - data/derived/caracteristicas.csv
  modelado:
    cmd: python src/modelar.py
    deps:
      - src/modelar.py
      - data/derived/caracteristicas.csv
    params:
      - modelado
    outs:
      - data/derived/predicciones.csv
      - data/derived/modelo.joblib
  evaluacion:
    cmd: python src/evaluar.py
    deps:
      - src/evaluar.py
      - data/derived/predicciones.csv
    metrics:
      - reports/metricas.json:
          cache: false
    plots:
      - reports/roc.csv:
          x: fpr
          y: tpr
          cache: false
