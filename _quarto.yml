project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - cursos/**/*.qmd
    - charlas-y-conferencias/**/*.qmd
    - proyectos/**/*.qmd
    - herramientas-y-tutoriales/**/*.qmd
  resources:
    - recursos/marca/logos/
    - recursos/marca/paleta.json
    - proyectos/**/codigo/*.py
    - herramientas-y-tutoriales/codigo/*.py
website:
  title: "P. E. Caicedo-Rodríguez"
  favicon: recursos/marca/logos/insignia.png
  navbar:
    logo: recursos/marca/logos/isotipo-claro.svg
    left:
      - href: index.qmd
        text: Perfil
      - href: cursos/index.qmd
        text: Cursos
      - href: charlas-y-conferencias/index.qmd
        text: Charlas y Conferencias
      - href: proyectos/index.qmd
        text: Proyectos
      - href: herramientas-y-tutoriales/index.qmd
        text: Herramientas y Tutoriales
  bread-crumbs: true
  search:
    location: navbar
    type: overlay
  page-footer:
    left: "Pablo Eduardo Caicedo-Rodríguez"
    right: "Ingeniería que hace comprensible la salud."
lang: es
format:
  html:
    theme: [cosmo, recursos/marca/caicedo-sitio.scss]
    highlight-style: recursos/marca/caicedo-claro.theme
    html-math-method: mathml
    toc: true
    toc-depth: 2
    toc-title: "En esta página"
    link-external-newwindow: true
execute:
  enabled: false
