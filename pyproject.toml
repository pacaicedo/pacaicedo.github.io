# Entorno de Python del sitio: lo que necesitan los figuras.py y los ejemplos de los cursos.
#   uv sync                      crea .venv/ con estas dependencias (y uv.lock la primera vez)
#   uv run quarto render         renderiza el sitio con ese entorno
[project]
name = "sitio-caicedo"
version = "2026.10"
description = "Cursos, charlas, proyectos y tutoriales de P. E. Caicedo-Rodríguez, hechos con Quarto."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
    "typer>=0.27",
    "numpy>=2.3",
    "scipy>=1.16",
    "polars>=1.35",           # cudf-polars (motor GPU) aún exige polars < 1.45
    "pyarrow>=21.0",
    "torch>=2.14",
    "torchvision>=0.29",
    "nvidia-ml-py>=13.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.9.1",
    "scikit-image>=0.26.0",
    "pycaret[full]==4.0.0a8",
]

[tool.uv]
package = false # es un sitio, no un paquete que se instale

[project.optional-dependencies]
gpu = [
    "lightgbm>=4.0", # Requiere compilación con soporte GPU
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.extra-build-dependencies]
pmdarima = ["numpy"]
